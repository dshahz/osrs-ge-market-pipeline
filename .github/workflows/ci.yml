name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Airflow and providers
        run: |
          pip install "apache-airflow==3.3.0" \
                      apache-airflow-providers-databricks \
                      --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.12.txt"

      - name: Check DAGs import cleanly
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import pathlib, sys
          from airflow.models import DagBag

          dagbag = DagBag(dag_folder="airflow/dags")

          if dagbag.import_errors:
              for path, error in dagbag.import_errors.items():
                  print(f"::error file={path}::{error}")
              sys.exit(1)

          print(f"OK: {len(dagbag.dags)} DAG(s) imported cleanly")
          for dag_id in sorted(dagbag.dags):
              print(f"  - {dag_id}")
          PY

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-databricks

      - name: Install dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Parse models
        working-directory: dbt
        env:
          # Parsing resolves refs and sources without connecting, so placeholder
          # credentials are enough to satisfy the profile.
          DATABRICKS_HOST: placeholder
          DATABRICKS_HTTP_PATH: /placeholder
          DATABRICKS_TOKEN: placeholder
          DBT_PROFILES_DIR: .
        run: dbt parse