name: Dashboard snapshot

# Refreshes the parquet file the dashboard falls back on when the Databricks
# warehouse is unreachable. One short warehouse session a day.

on:
  schedule:
    - cron: "0 22 * * *"  # 6 PM Toronto (EDT); move it to when Airflow is usually running
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export snapshot
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python dashboard/export_snapshot.py

      - name: Commit snapshot if it changed
        run: |
          git add dashboard/snapshot/
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh dashboard snapshot [skip ci]"
          git push
